<div class="card glow-hover">
  <div class="card-header">
    <div class="card-title">
      <i data-lucide="book-open" class="icon w-4.5 h-4.5"></i>
      Data Dictionary
    </div>
    <div class="header-search">
      <i data-lucide="search" class="search-icon w-4 h-4"></i>
      <input type="text" id="dict-search" placeholder="Search columns..." />
    </div>
  </div>
  
  <div class="overflow-x-auto w-full">
    <table class="min-w-full divide-y divide-zinc-200 dark:divide-zinc-800 text-left text-xs text-zinc-500 dark:text-zinc-400" id="dict-table">
      <thead class="text-zinc-700 dark:text-zinc-300 uppercase tracking-wider font-extrabold" style="background: var(--bg-input);">
        <tr>
          <th class="px-6 py-4">Column Name</th>
          <th class="px-6 py-4">Data Type</th>
          <th class="px-6 py-4">AI Description</th>
          <th class="px-6 py-4 text-center">Nulls</th>
          <th class="px-6 py-4 text-center">Uniques</th>
          <th class="px-6 py-4">Sample Values</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-200 dark:divide-zinc-800" id="dict-table-body">
        <tr>
          <td colspan="6" class="px-6 py-8 text-center text-zinc-500">No columns metadata available.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
