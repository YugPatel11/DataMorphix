<div class="card glow-hover animate-in">
  <div class="card-header">
    <div class="card-title">
      <i data-lucide="search" class="icon w-4.5 h-4.5 text-zinc-500"></i>
      Universal Metadata Search
    </div>
  </div>
  <p class="text-xs text-zinc-500 mb-6">Enter a keyword (e.g. "email", "salary", "date") to query all column names, classifications, types, and definitions across all registered tables.</p>

  <div class="header-search w-full mb-8">
    <i data-lucide="search" class="search-icon w-4 h-4"></i>
    <input type="text" id="global-search-input" placeholder="Search fields across datasets..." />
  </div>

  <div class="overflow-x-auto w-full">
    <table class="min-w-full divide-y divide-zinc-200 dark:divide-zinc-800 text-left text-xs text-zinc-500 dark:text-zinc-400" id="search-table" style="display: none;">
      <thead class="text-zinc-700 dark:text-zinc-300 uppercase tracking-wider font-extrabold" style="background: var(--bg-input);">
        <tr>
          <th class="px-5 py-3.5">Dataset</th>
          <th class="px-5 py-3.5">Column Name</th>
          <th class="px-5 py-3.5">Data Type</th>
          <th class="px-5 py-3.5">AI Description</th>
          <th class="px-5 py-3.5">Action</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-200 dark:divide-zinc-800" id="search-results-body">
      </tbody>
    </table>
    <div id="search-empty-state" class="text-center py-8 text-zinc-500 italic">Enter search term above.</div>
  </div>
</div>
