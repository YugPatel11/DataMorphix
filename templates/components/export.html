<div class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in">
  <!-- Metadata Analysis Export -->
  <div class="card glow-hover">
    <div class="card-header">
      <div class="card-title">
        <i data-lucide="download" class="icon w-4.5 h-4.5 text-[#2cc171]"></i>
        Export Metadata Analysis
      </div>
    </div>
    <p class="text-xs text-zinc-500 mb-6">Download the comprehensive analysis report containing AI summaries, column health evaluations, definitions, and governance findings.</p>
    <div class="grid grid-cols-2 gap-3">
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="exportAnalysis('pdf')">PDF Document</button>
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="exportAnalysis('excel')">Excel Sheet</button>
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="exportAnalysis('csv')">CSV Table</button>
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="exportAnalysis('json')">JSON Scheme</button>
    </div>
  </div>

  <!-- Updated Dataset Export -->
  <div class="card glow-hover">
    <div class="card-header">
      <div class="card-title">
        <i data-lucide="database" class="icon w-4.5 h-4.5 text-indigo-500"></i>
        Export Modified Dataset
      </div>
    </div>
    <p class="text-xs text-zinc-500 mb-6">Download the actual updated dataset records containing all modifications, new columns, renamed fields, and edits.</p>
    <div class="grid grid-cols-3 gap-3">
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="downloadDataset('csv')">CSV</button>
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="downloadDataset('excel')">Excel</button>
      <button class="export-btn font-extrabold text-xs uppercase p-3 border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500 hover:text-indigo-500 transition cursor-pointer" onclick="downloadDataset('json')">JSON</button>
    </div>
  </div>
</div>
