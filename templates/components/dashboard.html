<div class="stats-grid">
  <div class="stat-card green glow-hover">
    <div class="stat-label">Health Score</div>
    <div class="stat-value"><span id="dash-health-score">—</span><span class="text-zinc-500 font-semibold text-base ml-1">/100</span></div>
    <div class="health-gauge">
      <div class="health-gauge-fill" id="dash-health-fill" style="width: 0%"></div>
    </div>
  </div>
  <div class="stat-card blue glow-hover">
    <div class="stat-label">Total Records</div>
    <div class="stat-value" id="dash-row-count">—</div>
    <div class="stat-sub"><i data-lucide="rows-3" class="w-3 h-3 inline mr-1 align-middle"></i> Indexed Rows</div>
  </div>
  <div class="stat-card purple glow-hover">
    <div class="stat-label">Total Fields</div>
    <div class="stat-value" id="dash-col-count">—</div>
    <div class="stat-sub"><i data-lucide="columns-3" class="w-3 h-3 inline mr-1 align-middle"></i> Columns</div>
  </div>
  <div class="stat-card amber glow-hover">
    <div class="stat-label">Governance Alerts</div>
    <div class="stat-value" id="dash-issue-count">—</div>
    <div class="stat-sub"><i data-lucide="shield-alert" class="w-3 h-3 inline mr-1 align-middle"></i> Issues Detected</div>
  </div>
</div>

<div class="summary-card glow-hover" id="dash-summary-card" style="display: none;">
  <div class="summary-label"><i data-lucide="sparkles" class="w-3.5 h-3.5 inline mr-1 align-middle"></i> AI Context Analysis</div>
  <p class="summary-text" id="dash-summary-text"></p>
</div>

<div class="charts-grid">
  <div class="chart-card">
    <h4>Data Type Distribution</h4>
    <div style="position: relative; height: 280px; width: 100%;">
      <canvas id="type-chart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h4>Missing Values (Nulls)</h4>
    <div style="position: relative; height: 280px; width: 100%;" id="nulls-chart-wrapper">
      <canvas id="nulls-chart"></canvas>
    </div>
  </div>
</div>
